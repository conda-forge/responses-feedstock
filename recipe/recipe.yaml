schema_version: 1

context:
  name: responses
  version: "0.26.3"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: b0c11ca8131b8b227b8d5108e6ed39772222bd5aab030ed430e8f99057c4c409

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - pyyaml
    - python >=${{ python_min }}
    - requests >=2.30.0,<3.0
    - urllib3 >=1.25.10,<3.0
tests:
  - python:
      imports:
        - responses
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A utility library for mocking out the `requests` Python library.
  homepage: https://github.com/getsentry/responses

extra:
  recipe-maintainers:
    - thewchan
    - mariusvniekerk
