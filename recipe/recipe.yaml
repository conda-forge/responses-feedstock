schema_version: 1

context:
  name: responses
  version: "0.26.1"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 2eb3218553cc8f79b57d257bac23af5e1bf381f5b9390b1767816f0843e01dc2

build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - pyyaml
    - python >=${{ python_min }}
    - requests >=2.30.0,<3.0
    - types-pyyaml
    - typing_extensions
    - urllib3 >=1.25.10,<3.0

tests:
  - python:
      imports:
        - responses
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  license: Apache-2.0
  license_file: LICENSE
  summary: A utility library for mocking out the `requests` Python library.
  homepage: https://github.com/getsentry/responses

extra:
  recipe-maintainers:
    - thewchan
    - mariusvniekerk
